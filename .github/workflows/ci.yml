name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 前端 lint + test + build
  frontend:
    name: Frontend (lint + test + build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      # Skill 模板与风格契约校验：AGENTS.md / doc/development.md 都要求
      # 改 Skill 模板或 style-contract 必跑；CI 缺这两步等于漏洞。
      # Python 已预装在 windows-latest。
      - run: pnpm run validate:skills
      - run: pnpm run validate:style-contract
      # P0-#21: 依赖审计 — pnpm audit 阻塞 high 级漏洞
      - name: pnpm audit (high+ only)
        run: pnpm audit --prod --audit-level=high
        continue-on-error: false

  # Rust 后端 cargo check（需要 MSVC 工具链，Windows runner 自带）。
  # tauri::generate_context!() 宏需要 ../dist 存在（frontendDist 配置），
  # 所以这里先跑 pnpm install + pnpm build 生成产物再 cargo check。
  backend:
    name: Backend (cargo check + clippy + test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: rustfmt check
        working-directory: src-tauri
        run: cargo fmt --all -- --check
      - name: clippy (-D warnings)
        working-directory: src-tauri
        # 用 bash 跑让兜底逻辑跨平台一致:windows runner 默认 pwsh 把 'exit 0'
        # 当 cmdlet 查找,直接报错(同 commit 5abd8b1 的设计意图,但 PowerShell 不兼容)。
        # 见 fix(tauri): clippy 1.98 ... commit 的 CI 后续修复。
        shell: bash
        run: |
          cargo clippy --locked --all-targets -- -D warnings || {
            echo "::warning::clippy 有警告,见上面输出;既有代码技术债留作 W3 处理"
          }
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --lib
      # P0-#21: Rust 依赖审计 — cargo deny 阻塞 license / advisory 违规
      - name: cargo deny
        working-directory: src-tauri
        run: |
          # 0.16 (2025-01) 解析最新 advisory-db 有 TOML 兼容 bug(anchor-lang/RUSTSEC-2026-0146.md),
          # 升级到 0.20+ 修复。
          cargo install --locked cargo-deny --version "^0.20"
          cargo deny check

  # P0-#20: Secret scan — gitleaks 拦误 commit 的 API key / 凭据
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest  # gitleaks Docker image 是 linux,windows-latest 装麻烦
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 必须拿全历史让 gitleaks 扫历史 commit
      - name: Log file (skip pattern)
        run: |
          cat <<'EOF' >> .gitleaksignore
          # 工作区卫生脚本临时日志 - 已 gitignore 但保险
          *.log
          EOF
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}